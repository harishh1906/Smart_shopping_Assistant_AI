{% extends "base.html" %}

{% block title %}Register - SmartShop AI{% endblock %}

{% block content %}
<div class="glass-container auth-box">
    <h2 style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
    
    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="auth-form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" class="auth-input" placeholder="Aisha Patel" required>
        </div>
        
        <div class="auth-form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="auth-input" placeholder="aisha@example.com" required>
        </div>
        
        <div class="auth-form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="auth-input" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn auth-submit-btn">Create Account ✨</button>
    </form>
    
    <div class="auth-footer">
        <p>Already registered? <a href="{{ url_for('auth.login') }}">Sign In</a></p>
    </div>
</div>
{% endblock %}
